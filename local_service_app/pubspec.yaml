name: local_service_app
description: A production-grade local service booking application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Network
  dio: ^5.4.3
  pretty_dio_logger: ^1.3.1

  # Secure Storage
  flutter_secure_storage: ^9.0.0

  # Local Storage
  shared_preferences: ^2.2.3
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Maps (Free - OpenStreetMap)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  flutter_map_tile_caching: ^10.0.0

  # WebSocket / Chat
  socket_io_client: ^2.0.3+1

  # Payments
  razorpay_flutter: ^1.3.6

  # Media
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Animations
  lottie: ^3.1.0
  animate_do: ^3.3.4
  flutter_animate: ^4.5.0

  # UI Utilities
  flutter_svg: ^2.0.10+1
  intl: 0.20.2
  timeago: ^3.6.1
  badges: ^3.1.2
  flutter_staggered_animations: ^1.1.1
  pinput: ^3.0.1
  smooth_page_indicator: ^1.1.0
  dotted_border: ^2.1.0
  awesome_snackbar_content: ^0.1.3
  gap: ^3.0.1
  visibility_detector: ^0.4.0+2

  # File / Permissions
  permission_handler: ^11.3.0
  path_provider: ^2.1.3
  open_filex: ^4.5.0

  # Security
  local_auth: ^2.1.8
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0

  # Connectivity
  connectivity_plus: ^6.0.3

  # Crash / Analytics (free)
  firebase_core: ^2.30.1
  firebase_analytics: ^10.10.1
  firebase_crashlytics: ^3.5.7
  firebase_messaging: ^14.9.2

  # Utils
  uuid: ^4.4.0
  equatable: ^2.0.5
  dartz: ^0.10.1
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.1
  collection: ^1.18.0
  rxdart: ^0.27.7
  logger: ^2.3.0
  url_launcher: ^6.2.6
  share_plus: ^9.0.0
  flutter_launcher_icons: ^0.13.1

  http: any
  firebase_auth: ^4.20.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  json_serializable: ^6.8.0
  freezed: ^2.5.2
  mockito: ^5.4.4
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
